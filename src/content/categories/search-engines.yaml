name: Search Engines
noun: search engines
group: internet
icon: search
summary: Web search without profiling.
intro: >-
  Search engines index the web and answer queries. Few operate a fully independent index;
  many privacy-focused engines combine their own technology with results licensed from
  larger providers.
related: [dns-resolvers]
added: 2026-10-15
i18n:
  de:
    name: 'Suchmaschinen'
    noun: 'Suchmaschinen'
    summary: 'Websuche ohne Profilbildung.'
    intro: 'Suchmaschinen indexieren das Web und beantworten Suchanfragen. Nur wenige betreiben einen vollständig unabhängigen Index; viele datenschutzorientierte Suchmaschinen kombinieren eigene Technologie mit Ergebnissen, die sie von grösseren Anbietern lizenzieren.'

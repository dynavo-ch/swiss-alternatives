name: Public DNS Resolvers
noun: DNS resolvers
group: internet
icon: network
summary: Encrypted public DNS, often with malware and phishing blocking.
intro: >-
  Public DNS resolvers translate domain names into IP addresses for your devices. Choosing a
  resolver decides who sees which domains you visit; encrypted DNS (DoH/DoT) protects these
  lookups in transit.
related: [vpn, network-security]
added: 2026-10-15
i18n:
  de:
    name: 'Öffentliche DNS-Resolver'
    noun: 'DNS-Resolver'
    summary: 'Verschlüsseltes öffentliches DNS, oft mit Blockierung von Malware und Phishing.'
    intro: 'Öffentliche DNS-Resolver übersetzen für Ihre Geräte Domainnamen in IP-Adressen. Mit der Wahl des Resolvers entscheiden Sie, wer sieht, welche Domains Sie aufrufen; verschlüsseltes DNS (DoH/DoT) schützt diese Abfragen bei der Übertragung.'

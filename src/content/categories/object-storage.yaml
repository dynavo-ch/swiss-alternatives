name: Object Storage
noun: object storage services
group: cloud
icon: database
summary: S3-compatible storage for files, backups, media and application data.
intro: >-
  Object storage keeps large amounts of unstructured data behind an HTTP API, most often
  compatible with Amazon S3. Data location is usually chosen per bucket, so check which
  zones are in Switzerland.
related: [backup, cloud-platforms]
added: 2026-10-15
i18n:
  de:
    name: 'Objektspeicher'
    noun: 'Objektspeicher-Dienste'
    summary: 'S3-kompatibler Speicher für Dateien, Backups, Medien und Anwendungsdaten.'
    intro: 'Objektspeicher legt grosse Mengen unstrukturierter Daten hinter einer HTTP-API ab, meist kompatibel mit Amazon S3. Der Datenstandort wird in der Regel pro Bucket gewählt; prüfen Sie daher, welche Zonen in der Schweiz liegen.'

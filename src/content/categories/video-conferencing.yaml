name: Video Conferencing
noun: video conferencing tools
group: workplace
icon: video
summary: Video meetings and web conferencing.
intro: >-
  Video conferencing tools host online meetings with audio, video and screen sharing.
  Where the media servers run determines where meeting data passes through.
related: [team-chat, calendars]
added: 2026-10-15
i18n:
  de:
    name: 'Videokonferenzen'
    noun: 'Videokonferenz-Tools'
    summary: 'Videomeetings und Webkonferenzen.'
    intro: 'Videokonferenz-Tools ermöglichen Online-Meetings mit Audio, Video und Bildschirmfreigabe. Wo die Medienserver betrieben werden, bestimmt, über welche Standorte die Meetingdaten laufen.'

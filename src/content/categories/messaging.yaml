    intro: 'Messenger für die private und berufliche Nutzung. Ende-zu-Ende-Verschlüsselung schützt die Nachrichteninhalte; beim Umgang mit Metadaten und bei der Pflicht zur Angabe einer Telefonnummer unterscheiden sich die Apps erheblich.'

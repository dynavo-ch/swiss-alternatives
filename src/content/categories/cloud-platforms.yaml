name: Cloud Platforms
noun: cloud platforms
group: cloud
icon: cloud
summary: Infrastructure-as-a-service — virtual machines, networking, storage and managed services.
intro: >-
  Public cloud platforms provide on-demand compute, networking and storage through an API and a
  web console. Swiss providers typically offer fewer managed services than the global
  hyperscalers, but publish clear data locations and contract under Swiss law.
related: [vps-hosting, object-storage, kubernetes]

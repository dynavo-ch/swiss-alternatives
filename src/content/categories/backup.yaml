name: Backup
noun: backup services
group: cloud
icon: archive-restore
summary: Off-site backup for computers, servers and cloud data.
intro: >-
  Backup services keep independent copies of your data so you can recover from deletion,
  hardware failure or ransomware. Look at where copies are stored and who holds the keys.
related: [object-storage, cloud-storage]
added: 2026-10-15
i18n:
  de:
    name: 'Backup'
    noun: 'Backup-Dienste'
    summary: 'Externe Datensicherung für Computer, Server und Cloud-Daten.'
    intro: 'Backup-Dienste halten unabhängige Kopien Ihrer Daten vor, damit Sie diese nach einer Löschung, einem Hardwaredefekt oder einem Ransomware-Angriff wiederherstellen können. Achten Sie darauf, wo die Kopien gespeichert sind und wer die Schlüssel hält.'

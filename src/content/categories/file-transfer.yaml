name: File Transfer
noun: file transfer services
group: workplace
icon: send
summary: Send large files by link, without a shared folder.
intro: >-
  File transfer services upload a file once and send a time-limited download link —
  the classic use case of WeTransfer.
related: [file-sharing, cloud-storage]
added: 2026-10-15
i18n:
  de:
    name: 'Dateiübertragung'
    noun: 'Dienste zur Dateiübertragung'
    summary: 'Grosse Dateien per Link versenden, ohne gemeinsamen Ordner.'
    intro: 'Dienste zur Dateiübertragung laden eine Datei einmal hoch und versenden einen zeitlich begrenzten Download-Link – der klassische Anwendungsfall von WeTransfer.'

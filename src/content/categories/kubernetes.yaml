name: Managed Kubernetes
noun: managed Kubernetes services
group: cloud
icon: boxes
summary: Managed Kubernetes clusters with the control plane operated for you.
intro: >-
  Managed Kubernetes services run the cluster control plane and node lifecycle so teams can
  deploy containers without operating Kubernetes themselves.
related: [cloud-platforms, paas]
added: 2026-10-15
i18n:
  de:
    name: 'Managed Kubernetes'
    noun: 'Managed-Kubernetes-Dienste'
    summary: 'Verwaltete Kubernetes-Cluster, deren Control Plane der Anbieter betreibt.'
    intro: 'Managed-Kubernetes-Dienste betreiben die Control Plane des Clusters und den Lebenszyklus der Nodes, sodass Teams Container bereitstellen können, ohne Kubernetes selbst zu betreiben.'

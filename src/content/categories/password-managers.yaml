name: Password Managers
noun: password managers
group: security
icon: key-round
summary: Generate, store, share and autofill passwords and passkeys.
intro: >-
  Password managers create strong unique passwords, store them in an encrypted vault and
  fill them in across devices. Most modern managers also store passkeys and two-factor
  codes.
related: [authentication, vpn]
added: 2026-10-15
i18n:
  de:
    name: 'Passwort-Manager'
    noun: 'Passwort-Manager'
    summary: 'Passwörter und Passkeys erzeugen, speichern, teilen und automatisch ausfüllen.'
    intro: 'Passwort-Manager erzeugen starke, eindeutige Passwörter, speichern sie in einem verschlüsselten Tresor und füllen sie geräteübergreifend aus. Die meisten aktuellen Passwort-Manager speichern auch Passkeys und Zwei-Faktor-Codes.'

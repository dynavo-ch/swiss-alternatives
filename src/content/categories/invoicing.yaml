name: Invoicing
noun: invoicing tools
group: business
icon: receipt
summary: Quotes, invoices, QR-bills and payment reminders.
intro: >-
  Invoicing tools create quotes and invoices, track payments and send reminders. In
  Switzerland, support for QR-bills is essential.
related: [accounting, crm]
added: 2026-10-15
i18n:
  de:
    name: 'Rechnungsstellung'
    noun: 'Rechnungs-Tools'
    summary: 'Offerten, Rechnungen, QR-Rechnungen und Mahnungen.'
    intro: 'Rechnungs-Tools erstellen Offerten und Rechnungen, verfolgen Zahlungseingänge und versenden Mahnungen. In der Schweiz ist die Unterstützung der QR-Rechnung unerlässlich.'

name: Cloud Storage
noun: cloud storage services
group: workplace
icon: hard-drive
summary: Sync, store and access files across devices.
intro: >-
  Cloud storage services sync files between your devices and keep a copy online. Some
  encrypt files on your device before upload (end-to-end encryption), which means the
  provider cannot read them.
related: [file-sharing, backup, file-transfer]
added: 2026-10-15
i18n:
  de:
    name: 'Cloud-Speicher'
    noun: 'Cloud-Speicher'
    summary: 'Dateien geräteübergreifend synchronisieren, speichern und abrufen.'
    intro: 'Cloud-Speicherdienste synchronisieren Dateien zwischen Ihren Geräten und halten eine Kopie online vor. Einige verschlüsseln Dateien vor dem Hochladen auf Ihrem Gerät (Ende-zu-Ende-Verschlüsselung), sodass der Anbieter sie nicht lesen kann.'

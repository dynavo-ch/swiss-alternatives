name: Office Suites
noun: office suites
group: workplace
icon: layout-grid
summary: Integrated email, calendar, documents and file storage for teams.
intro: >-
  Office suites bundle email, calendar, contacts, file storage and collaborative documents
  under one account. They are the most common replacement for Google Workspace and
  Microsoft 365.
related: [email, cloud-storage, calendars]
added: 2026-10-15
i18n:
  de:
    name: 'Office-Suiten'
    noun: 'Office-Suiten'
    summary: 'E-Mail, Kalender, Dokumente und Dateispeicher für Teams in einem integrierten Paket.'
    intro: 'Office-Suiten bündeln E-Mail, Kalender, Kontakte, Dateispeicher und gemeinsam bearbeitbare Dokumente unter einem Konto. Sie sind der häufigste Ersatz für Google Workspace und Microsoft 365.'

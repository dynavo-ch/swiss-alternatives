name: AI Assistants
noun: AI assistants
group: ai
icon: bot
summary: Chat assistants for writing, research and everyday questions.
intro: >-
  AI assistants answer questions, draft text and summarise documents using large language
  models. Where prompts are processed and whether they are used for training differs
  between services.
related: [language-models]
added: 2026-10-15
i18n:
  de:
    name: 'KI-Assistenten'
    noun: 'KI-Assistenten'
    summary: 'Chat-Assistenten zum Schreiben, Recherchieren und für Alltagsfragen.'
    intro: 'KI-Assistenten beantworten Fragen, entwerfen Texte und fassen Dokumente zusammen – auf Basis grosser Sprachmodelle. Wo Eingaben verarbeitet werden und ob sie für das Training verwendet werden, unterscheidet sich je nach Dienst.'

  parent: Infomaniak SA (controlled by the Infomaniak Foundation)
  parentCountry: CH
  basis: vendor
  source: investors
  note: >-
    In May 2026 founder Boris Siegenthaler transferred the majority of voting
    rights to the Infomaniak Foundation, a Swiss public-interest foundation. In
    September 2026 the SIX-listed Perrot Duval Holding SA acquired 100% of
    Infomaniak Group SA in a reverse takeover and was renamed Infomaniak SA
    (ticker INFO, trading since 1 October 2026). The Foundation holds all
    unlisted, non-transferable Class A shares and the majority of voting rights;
    the listed Class B shares carry a minority of votes. The founder and about 30
    employees also hold shares. Infomaniak Network SA is the group's operating
    company and contracting entity; its place under Infomaniak Group SA is
    inferred from the shared address, management and group references rather
    than stated explicitly in the sources consulted.

name: Infomaniak Network SA
shortName: Infomaniak
type: company
description: >-
  Geneva-based cloud provider that runs its own data centres in Switzerland and
  offers web hosting, cloud infrastructure, collaboration tools and AI services.
  Its group holding has been listed on SIX Swiss Exchange since October 2026.
website: https://www.infomaniak.com
founded: 1994

i18n:
  de:
    description: 'Lausanner Unternehmen, 2019 gegründet, das eine KI-Plattform für KMU und öffentliche Verwaltungen entwickelt, basierend auf in der Schweiz gehosteten Open-Source-Sprachmodellen.'
    notes:
      swissFounded.note: 'Im Mai 2019 im Handelsregister des Kantons Waadt eingetragen, mit Statuten vom 20. Mai 2019. Deeplink gibt an, am 3. Juni 2019 von Jérôme Berthier, seinem CEO, gegründet worden zu sein.'

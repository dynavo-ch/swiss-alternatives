name: ePost Service AG
shortName: ePost Service
type: company
description: >-
  Lucerne-based subsidiary of Swiss Post, formerly KLARA Business AG, that
  develops the KLARA business software for SMEs and the ePost digital mail
  services.
website: https://www.epost.ch
founded: 2016
swissFounded:
  value: yes
  basis: verified
  source: moneyhouse
  note: >-
    KLARA was founded in 2016 as a subsidiary of Axon Management AG. The legal
    entity was first entered in the commercial register of the canton of
    Lucerne on 23 December 1993 under a different name; previous names
    include Prepress Center AG, Systempuls AG and KLARA Business AG. It took
    the name ePost Service AG in 2024.

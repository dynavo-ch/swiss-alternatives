ownership:
  swissOwned: yes
  parent: Swiss Post (Die Schweizerische Post AG)
  parentCountry: CH
  basis: vendor
  source: klara
  note: >-
    KLARA describes ePost Service AG as a subsidiary of Swiss Post, which is
    wholly owned by the Swiss Confederation. Swiss Post took a 50.1% majority
    in KLARA Business AG in September 2020, after holding 9% since 2018; the
    founders kept 49.9% and KLARA continued as a joint venture of Swiss Post
    and the Axon group. The current percentages after capital increases in
    2025 are not published.

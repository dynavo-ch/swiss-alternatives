i18n:
  de:
    description: 'IT-Dienstleister aus Rotkreuz, ehemals ITpoint Systems, der die Cloud- und Managed Services ORIA betreibt; seit 2021 Teil der Sharp-Gruppe.'
    notes:
      swissFounded.note: 'Das Unternehmen ist in Risch (Rotkreuz) im Kanton Zug eingetragen, wo es als IT Point AG, ITpoint AG und ITpoint Systems AG firmierte, bevor es im Juli 2026 seinen heutigen Namen annahm. Sharp DX gibt an, über mehr als 20 Jahre Erfahrung zu verfügen.'
      headquarters.note: 'Die Geschäftsadresse liegt in Rotkreuz, das zur Gemeinde Risch gehört. Weitere Standorte werden in Bern und Genf genannt.'
      ownership.note: 'Sharp Electronics Europe übernahm per 12. März 2021 sämtliche Aktien der ITpoint Systems. Seit 2025 wird der Verwaltungsrat laut Handelsregister von japanischen Staatsangehörigen mit Wohnsitz in London präsidiert, und im August 2026 wurde das Unternehmen im Rahmen der IT-Service-Marke von Sharp Europe in Sharp DX umbenannt. Die Sharp Corporation nennt die taiwanesische Hon Hai Precision Industry, die direkt und über eine Tochtergesellschaft 34,1 % der Stimmrechte hält, als ihre Muttergesellschaft.'

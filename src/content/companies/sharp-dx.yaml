name: Sharp DX (Schweiz) AG
shortName: Sharp DX
type: company
description: >-
  Rotkreuz IT service provider, formerly ITpoint Systems, that runs the ORIA
  cloud and managed services; part of the Sharp group since 2021.
website: https://www.oria.ch
swissFounded:
  value: yes
  basis: verified
  source: zefix
  note: >-
    The company is registered in Risch (Rotkreuz) in the canton of Zug, where it
    traded as IT Point AG, ITpoint AG and ITpoint Systems AG before taking its
    current name in July 2026. Sharp DX states that it has more than 20 years of
    experience.
headquarters:
  city: Risch
  canton: ZG
  country: CH
  basis: verified
  source: zefix
  note: >-
    The office address is in Rotkreuz, part of the municipality of Risch. Further
    locations are listed in Bern and Geneva.
jurisdiction: CH
registry:
  uid: CHE-109.370.171
  url: https://www.zefix.ch/en/search/entity/list/firm/655831
ownership:
  swissOwned: no
  parent: Sharp Corporation
  parentCountry: JP
  basis: verified
  source: press-acquisition
  note: >-
    Sharp Electronics Europe acquired all shares of ITpoint Systems with effect
    from 12 March 2021. Since 2025 the board has been chaired by Japanese
    nationals living in London, according to the commercial register, and in
    August 2026 the company was renamed Sharp DX as part of Sharp Europe's IT
    services brand. Sharp Corporation names Taiwan's Hon Hai Precision Industry,
    which holds 34.1% of the voting rights directly and through a subsidiary, as
    its parent company.
lastVerified: 2026-11-08

  url: https://www.uid.admin.ch/Detail.aspx?uid_id=CHE435091407
ownership:
  swissOwned: yes
  basis: verified
  source: moneyhouse
  note: >-
    A foundation under Swiss law has no shareholders. Quad9 is governed by its
    foundation council, which includes members from Switzerland and abroad, and
    is supervised by the Swiss Federal Department of Home Affairs. Its operating
    budget comes from sponsorships, grants and donations; founding sponsors
    were the Global Cyber Alliance, IBM and Packet Clearing House.

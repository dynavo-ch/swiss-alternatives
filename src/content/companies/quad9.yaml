name: Quad9 Foundation
shortName: Quad9
type: foundation
description: >-
  Not-for-profit foundation in Zurich that operates the Quad9 public DNS
  resolver. It moved its headquarters from California to Switzerland in 2021.
website: https://quad9.net
swissFounded:
  value: no
  basis: vendor
  source: relocation
  note: >-
    Quad9 began as a project of the Global Cyber Alliance, IBM and Packet
    Clearing House and launched its public service in 2017. In February 2021 it
    announced the move of its headquarters from California to Zurich; the Swiss
    foundation (registered name "Quad9") was entered in the Zurich commercial
    register on 9 June 2021.
headquarters:
  city: Zürich
  canton: ZH
  country: CH

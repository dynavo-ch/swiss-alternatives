i18n:
  de:
    description: 'Zürcher IT-Sicherheitsunternehmen, das Software für Verschlüsselung und Data Loss Prevention entwickelt und Beratung in Sicherheit und Business-Analyse anbietet.'
    notes:
      swissFounded.note: 'e3 gibt an, seit 25 Jahren für seine Kundschaft tätig zu sein, und das Copyright der Website beginnt im Jahr 2000. Die heutige operative Gesellschaft e3 AG wurde später ins Handelsregister des Kantons Zürich eingetragen; die Holdinggesellschaft der Gruppe, die e3 Holding AG in Zürich, firmierte früher als e3 Consulting AG und e3 AG.'
      headquarters.note: 'e3 hat einen weiteren Standort in Bern und nennt Gesellschaften in Frankfurt am Main und Eindhoven. Im April 2026 wurde das Beratungsgeschäft auf die neu eingetragene e3 Consulting AG in Bern übertragen.'
      ownership.note: 'Die Aktionäre werden nicht veröffentlicht. Die seit 2016 in Handelsregisterpublikationen genannten Verwaltungsratsmitglieder sind ein Schweizer Bürger und ein italienischer Staatsangehöriger, beide mit Wohnsitz in der Schweiz; sie sitzen auch im Verwaltungsrat der e3 Holding AG an derselben Zürcher Adresse. CEO Thomas Fürling, Schweizer Bürger, ist Verwaltungsratsmitglied der e3 Consulting AG. Bis November 2026 wurde keine Übernahme gemeldet.'

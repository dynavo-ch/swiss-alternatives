name: e3 AG
shortName: e3
type: company
description: >-
  Zurich IT security company that develops encryption and data loss prevention
  software and provides security and business analysis consulting.
website: https://www.e3ag.ch
founded: 2000
swissFounded:
  value: yes
  basis: inferred
  source: company
  note: >-
    e3 states that it has worked for its customers for 25 years, and its website
    copyright runs from 2000. The current operating company e3 AG was entered in
    the commercial register of the canton of Zurich later; the group's holding
    company, e3 Holding AG in Zurich, previously traded as e3 Consulting AG and
    e3 AG.

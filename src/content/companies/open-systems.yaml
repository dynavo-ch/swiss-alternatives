  parent: Die Schweizerische Post AG (Swiss Post)
  parentCountry: CH
  basis: verified
  source: bankinfosecurity
  note: >-
    Swiss Post announced in 2024 that it would buy Open Systems from the
    private equity firm EQT, majority owner since 2017; Open Systems
    states that the acquisition closed on 21 October 2024 and that the company
    continues to operate under its own brand. Trade press in 2026 still
    describes Open Systems as part of Swiss Post, and the board was replaced in
    November 2024. Swiss Post is owned by the Swiss Confederation. Open Systems'
    former managed detection and response business had been split off as
    Ontinue, which stayed with EQT.

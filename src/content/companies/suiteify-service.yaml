name: Suiteify Service AG
shortName: Suiteify Service
type: company
description: >-
  Stäfa-based company, until 2026 named Run my Accounts AG, that operates the
  Run my Accounts online bookkeeping service and software. It belongs to the
  Suiteify group (formerly Infoniqa).
website: https://www.runmyaccounts.ch
founded: 2008
swissFounded:
  value: yes
  basis: verified
  source: moneyhouse
  note: >-
    Entered in the Zurich commercial register on 23 June 2008. Earlier company
    names include Run my Accounts GmbH and Run my Accounts AG; the name changed
    to Suiteify Service AG with effect from the amendment of the articles on
    15 September 2026.

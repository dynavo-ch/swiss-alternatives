  parent: Suiteify group (formerly Infoniqa group)
  parentCountry: AT
  basis: vendor
  source: press-acquisition
  note: >-
    The Austrian Infoniqa group acquired 100% of Run my Accounts in 2021,
    according to its announcement. In September 2026 the group merged its
    companies and brands under the name Suiteify. The group imprint names
    Suiteify Group Holding GmbH in Wels, Austria, as its main entity and also
    lists a shareholder address in Böblingen, Germany. According to press
    reports the group is backed by the US investor Warburg Pincus.

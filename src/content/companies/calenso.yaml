founded: 2016
swissFounded:
  value: yes
  basis: vendor
  source: about
  note: >-
    Calenso states it was founded in Lucerne in 2016 by three founders. The
    current company, Calenso AG, was entered in the Lucerne commercial register
    in May 2022 (seat Neuenkirch) and moved its seat to Rothenburg in 2023.

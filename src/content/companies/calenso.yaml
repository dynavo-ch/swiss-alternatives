name: Calenso AG
shortName: Calenso
type: company
description: >-
  Software company in Rothenburg near Lucerne that develops the Calenso
  appointment-booking platform. Part of the US group jrni Holdings, Inc. since
  2025.
website: https://calenso.com
founded: 2016
swissFounded:
  value: yes
  basis: vendor
  source: about
  note: >-
    Calenso states it was founded in Lucerne in 2016 by three founders. The
    current company, Calenso AG, was entered in the Lucerne commercial register
    in May 2022 (seat Neuenkirch) and moved its seat to Rothenburg in 2023.

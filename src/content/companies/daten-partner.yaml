name: DATEN PARTNER GmbH
shortName: Daten Partner
type: company
description: >-
  Zurich company founded in 2017 that offers the data.share virtual data rooms
  for property, foundation, art and estate documents; its owner also heads Meier
  Planungsdienste GmbH.
website: https://datenpartner.ch
founded: 2017
swissFounded:
  value: yes
  basis: verified
  source: zefix
  note: >-
    Entered in the commercial register of the canton of Zurich in May 2017, with
    articles of association dated 26 April 2017. Daten Partner states that it was
    founded as a further step of Meier Planungsdienste GmbH and that the
    data.share platform, originally built for the construction sector, has been
    in use since 2001.

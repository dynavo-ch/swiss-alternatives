i18n:
  de:
    description: 'Zürcher Unternehmen, 2017 gegründet, das die virtuellen Datenräume data.share für Liegenschafts-, Stiftungs-, Kunst- und Nachlassdokumente anbietet; ihr Inhaber leitet auch die Meier Planungsdienste GmbH.'
    notes:
      swissFounded.note: 'Im Mai 2017 im Handelsregister des Kantons Zürich eingetragen, mit Statuten vom 26. April 2017. Daten Partner gibt an, als weiterer Schritt der Meier Planungsdienste GmbH gegründet worden zu sein und dass die ursprünglich für die Baubranche entwickelte Plattform data.share seit 2001 im Einsatz ist.'
      ownership.note: "Gemäss Handelsregister hält Hans-Rudolf Meier, Schweizer Bürger mit Wohnsitz in Zürich, als einziger Gesellschafter sämtliche 20 Stammanteile zu CHF 1'000. Daten Partner bezeichnet sich als Familienunternehmen in zweiter Generation. Bis Oktober 2026 wurde kein Verkauf gemeldet."

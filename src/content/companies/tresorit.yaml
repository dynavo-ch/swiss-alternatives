name: Tresorit AG
shortName: Tresorit
type: company
description: >-
  Zurich-based provider of end-to-end encrypted cloud storage and file sharing,
  founded in 2011 by Hungarian developers and wholly owned by Swiss Post. Offices
  in Zurich, Munich and Budapest.
website: https://tresorit.com
founded: 2011
swissFounded:
  value: no
  basis: inferred
  source: gleif
  note: >-
    Tresorit was founded in 2011 by Hungarian developers; the Hungarian company
    Tresorit Kft. (Budapest) was incorporated on 15 September 2011. Tresorit AG
    in Zurich has been registered for VAT since 2013 and is now the contracting
    entity and head office.

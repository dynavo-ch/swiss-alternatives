  note: >-
    Worldsoft has a share capital of CHF 300,000 in 30 million registered
    shares that are not listed on a stock exchange; the shareholders are not
    published. Co-founder Gert F. Lang, a Swiss citizen, sits on the board, and
    CEO Oliver Greiner, an Austrian national living in Switzerland, has led the
    company since 2019. About 57% of customers were in Germany in 2018.

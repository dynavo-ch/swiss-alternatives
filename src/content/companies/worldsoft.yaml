name: Worldsoft AG
shortName: Worldsoft
type: company
description: >-
  Hosting and software company in Pfäffikon SZ, founded in 2000, offering
  website building, CRM, email marketing, invoicing and email hosting for small
  businesses.
website: https://www.worldsoft.info
founded: 2000
swissFounded:
  value: yes
  basis: vendor
  source: shareholders
  note: >-
    Worldsoft states that it was founded on 1 September 2000 by Helmut J. Ament
    and Gert F. Lang. It is registered in the commercial register of the canton
    of Schwyz with its seat in Freienbach.
headquarters:
  city: Freienbach

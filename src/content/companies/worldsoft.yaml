i18n:
  de:
    description: 'Hosting- und Softwareunternehmen in Pfäffikon SZ, gegründet 2000, mit Website-Baukasten, CRM, E-Mail-Marketing, Fakturierung und E-Mail-Hosting für kleine Unternehmen.'
    notes:
      swissFounded.note: 'Worldsoft gibt an, am 1. September 2000 von Helmut J. Ament und Gert F. Lang gegründet worden zu sein. Das Unternehmen ist im Handelsregister des Kantons Schwyz mit Sitz in Freienbach eingetragen.'
      headquarters.note: 'Die Büros befinden sich in Pfäffikon SZ, einem Ortsteil der Gemeinde Freienbach.'
      ownership.note: "Worldsoft hat ein Aktienkapital von CHF 300'000, aufgeteilt in 30 Millionen Namenaktien, die nicht an einer Börse gehandelt werden; die Aktionäre werden nicht veröffentlicht. Mitgründer Gert F. Lang, Schweizer Bürger, ist Mitglied des Verwaltungsrats, und CEO Oliver Greiner, österreichischer Staatsangehöriger mit Wohnsitz in der Schweiz, leitet das Unternehmen seit 2019. 2018 befanden sich rund 57 % der Kunden in Deutschland."

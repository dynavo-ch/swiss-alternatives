name: walkingtoweb GmbH
shortName: walkingtoweb
type: company
description: >-
  Owner-managed Zurich hosting company, registered in 2017, that runs managed
  Nextcloud, Kerio Connect e-mail and Claris FileMaker servers on its own
  hardware in Swiss data centres.
website: https://www.walkingtoweb.com
founded: 2017
swissFounded:
  value: yes
  basis: verified
  source: zefix
  note: >-
    walkingtoweb GmbH was entered in the commercial register of the canton of
    Zurich in July 2017 (articles dated 7 July 2017). The company says it has
    offered hosting services for more than 30 years; an earlier business could
    not be identified in the register.

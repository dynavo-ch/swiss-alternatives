name: Nevis Security AG
shortName: Nevis
type: company
description: >-
  Zurich-based software company, spun off from AdNovum and independent since
  2020, that develops customer identity and access management and
  authentication products.
website: https://www.nevis.net
founded: 2019
swissFounded:
  value: yes
  basis: verified
  source: moneyhouse
  note: >-
    NEVIS Security AG was entered in the commercial register of the canton of
    Zurich on 13 December 2019. The Nevis security suite was previously a
    business unit of the Zurich software company AdNovum Informatik AG and has
    operated as an independent company since the start of 2020.
headquarters:
  city: Zürich
  canton: ZH
  country: CH
  basis: verified
  source: uid-register
jurisdiction: CH
registry:
  uid: CHE-299.693.105
  url: https://www.uid.admin.ch/Detail.aspx?uid_id=CHE299693105
ownership:
  swissOwned: yes
  parent: IHAG Holding AG
  parentCountry: CH
  basis: verified
  source: itreseller-spinoff
  note: >-
    The commercial register does not publish shareholders. When AdNovum spun
    off Nevis in December 2019, IT-Reseller reported that the Nevis group
    remained owned by IHAG Holding, and KuppingerCole's October 2024 report
    still describes Nevis as a private company owned by IHAG Holding. An IHAG
    Holding investment director sits on the Nevis board; Nevis describes IHAG
    as a family-owned group of companies. IHAG Holding AG is registered in
    Zurich. No later change of control was found. Nevis has subsidiaries in
    Germany (Berlin) and Hungary (Budapest) and a branch in London.

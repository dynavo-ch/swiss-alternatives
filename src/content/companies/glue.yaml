i18n:
  de:
    description: 'Berner Softwareunternehmen, das Individualsoftware für E-Government und den öffentlichen Verkehr baut und eSignR entwickelt, eine Software für qualifizierte elektronische Signaturen.'
    notes:
      swissFounded.note: 'Glue gibt an, dass die Glue-Gruppe 1993 gegründet wurde und 35 Mitarbeitende in Bern beschäftigt. Die heutige Gesellschaft, in Bern als Glue Holding AG eingetragen, hat im Juni 2025 ihre Tochtergesellschaften Glue Software Engineering AG, fence IT AG, basis06 AG und Glue Data GmbH übernommen und wurde in Glue AG umbenannt.'
      ownership.note: 'Die Datenschutzerklärung von eSignR gibt an, dass alle am Betrieb von eSignR beteiligten Unternehmen vollständig im Besitz von Schweizer Unternehmen sind. Die Aktionäre der Aktiengesellschaft werden nicht publiziert; alle im Handelsregister eingetragenen Verwaltungsratsmitglieder sind Schweizer Bürger. Bis November 2026 wurde keine Übernahme gemeldet.'

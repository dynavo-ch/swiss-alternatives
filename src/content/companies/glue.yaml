  note: >-
    Glue states that the Glue Group was founded in 1993 and employs 35 people in
    Bern. The current legal entity, registered in Bern as Glue Holding AG,
    absorbed its subsidiaries Glue Software Engineering AG, fence IT AG,
    basis06 AG and Glue Data GmbH in June 2025 and was renamed Glue AG.

    description: 'Softwareunternehmen in Vernier GE, gegründet 2026, das SoloDesk entwickelt, einen Buchhaltungs- und Rechnungsdienst für Schweizer Einzelunternehmen, Kleinunternehmen und Treuhandbüros.'

  note: >-
    In July 2024 funds advised by Munich-based Bregal Unternehmerkapital agreed
    to acquire a majority stake in BSI from Capvis Equity V, which had held the
    majority since 2020; completion was subject to regulatory approval. The
    deal was reported by the press and by the parties' legal advisers. The
    founders, management and employees remain shareholders. The website imprint
    names the holding company BSI Software AG (Baden, registered in 2020),
    while the privacy policy names BSI Business Systems Integration AG as
    controller.

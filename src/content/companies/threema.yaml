  note: >-
    Frankfurt-based private equity firm Comitis Capital acquired Threema from
    Afinum Management and the founders; the deal was announced in January 2026.
    Afinum had held a majority stake since 2020, and the founders left the
    company in 2024. Threema states that its headquarters, servers and
    management remain in Switzerland.

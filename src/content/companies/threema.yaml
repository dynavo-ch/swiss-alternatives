name: Threema AG
shortName: Threema
type: company
description: >-
  Company based in Pfäffikon SZ (municipality of Freienbach) that develops the
  Threema end-to-end encrypted messenger for private users and organisations.
  Owned by German investment firm Comitis Capital since early 2026.
website: https://threema.com
founded: 2012
swissFounded:
  value: yes
  basis: vendor
  source: about
  note: >-
    The app was released in December 2012 by three Swiss developers in Zurich;
    Threema GmbH was set up in spring 2014. In July 2026 Threema GmbH was merged
    into the former Threema Holding AG, which was renamed Threema AG.

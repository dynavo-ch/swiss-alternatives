name: FIDUCIAL WINBIZ SA
shortName: Winbiz
type: company
description: >-
  Geneva-based publisher of the Winbiz business software for Swiss SMEs, with
  offices in Lausanne and Martigny, owned by the French Fiducial group.
website: https://www.winbiz.ch
founded: 1972
swissFounded:
  value: yes
  basis: verified
  source: press
  note: >-
    A 2013 trade press report describes the original developer, La Gestion
    Electronique of Martigny, as founded in 1972. The commercial register shows
    that the company moved its seat from Martigny to Geneva in 2014 as LOGICIAL SA
    and took its current name in 2020.
headquarters:
  city: Genève
  canton: GE
  country: CH
  basis: verified
  source: zefix
  note: The company has branch offices in Lausanne and Martigny.

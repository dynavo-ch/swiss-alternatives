ownership:
  swissOwned: no
  parent: Fiducial
  parentCountry: FR
  basis: verified
  source: press
  note: >-
    In March 2013 the French group Fiducial announced the takeover of La Gestion
    Electronique, the developer of Winbiz. Winbiz states that it benefits from
    the support of an international group. Most board members entered in the
    commercial register are French nationals living in France. No later change
    of ownership was found in reporting up to November 2026.

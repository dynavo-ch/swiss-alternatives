i18n:
  de:
    description: 'Genfer Herausgeber der Business-Software Winbiz für Schweizer KMU, mit Niederlassungen in Lausanne und Martigny, im Besitz der französischen Fiducial-Gruppe.'
    notes:
      swissFounded.note: 'Ein Fachmedienbericht von 2013 beschreibt die ursprüngliche Entwicklerin, La Gestion Electronique aus Martigny, als 1972 gegründet. Laut Handelsregister verlegte die Gesellschaft 2014 als LOGICIAL SA ihren Sitz von Martigny nach Genf und trägt seit 2020 den heutigen Namen.'
      headquarters.note: 'Das Unternehmen hat Zweigniederlassungen in Lausanne und Martigny.'
      ownership.note: 'Im März 2013 gab die französische Gruppe Fiducial die Übernahme von La Gestion Electronique bekannt, der Entwicklerin von Winbiz. Winbiz gibt an, von der Unterstützung einer internationalen Gruppe zu profitieren. Die meisten im Handelsregister eingetragenen Verwaltungsratsmitglieder sind französische Staatsangehörige mit Wohnsitz in Frankreich. Bis November 2026 wurde keine spätere Änderung der Eigentumsverhältnisse gemeldet.'

      swissFounded.note: 'Im August 2021 im Handelsregister des Kantons Zug eingetragen.'
      ownership.note: "Die Aktionäre der Aktiengesellschaft werden nicht veröffentlicht. Der im Handelsregister eingetragene Verwaltungsratspräsident, laut compliag auch Geschäftsführer ad interim, ist deutscher Staatsangehöriger mit Wohnsitz in Zug; das weitere Verwaltungsratsmitglied ist Schweizer Bürgerin. Das Aktienkapital wurde im Dezember 2025 von CHF 100'000 auf CHF 600'000 erhöht. Das Impressum nennt die compliag GmbH in Wien als verantwortlich für die EU; wie die beiden Gesellschaften zusammenhängen, wird nicht angegeben. Bis Oktober 2026 wurde keine Übernahme gemeldet."

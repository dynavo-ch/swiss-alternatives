i18n:
  de:
    description: 'Softwareunternehmen in Schwerzenbach ZH, das Geschäftsverwaltungs-, Sitzungs- und Fachanwendungen für Schweizer Kantone, Gemeinden, Schulen und Archive entwickelt.'
    notes:
      swissFounded.note: 'CMI gibt an, als Einzelfirma CM Informatik (Computer Management Informatik) begonnen zu haben, die Peter Bosshard in eine Aktiengesellschaft umwandelte, und über mehr als 35 Jahre Erfahrung zu verfügen.'

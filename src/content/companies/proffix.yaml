ownership:
  swissOwned: no
  parent: Forterro
  parentCountry: GB
  basis: vendor
  source: imprint
  note: >-
    Proffix states that it is part of Forterro, a European ERP software group
    headquartered in London. Forterro announced the acquisition of Proffix in
    August 2023, and the company was renamed from PROFFIX Software AG to
    Forterro Schweiz Proffix AG in November 2024. In March 2022 Forterro
    announced that it had been acquired by Partners Group, a Swiss
    private-markets firm, acting on behalf of its clients; the current
    shareholder structure of the Forterro group was not re-verified.

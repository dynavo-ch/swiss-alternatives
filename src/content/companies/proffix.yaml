name: Forterro Schweiz Proffix AG
shortName: Proffix
type: company
description: >-
  Software company in Altendorf SZ, originally PROFFIX Software AG, that develops
  the Proffix ERP software for Swiss SMEs. It has been part of the London-based
  Forterro group since 2023.
website: https://www.proffix.ch
founded: 2001
swissFounded:
  value: yes
  basis: verified
  source: moneyhouse
  note: >-
    Entered in the commercial register on 7 February 2001 under the earlier
    name PROFFIX Software AG; until 2026 its seat was Vilters-Wangs SG.
    Proffix describes its origins as four business partners who set out to
    build business software for Swiss SMEs.
headquarters:
  city: Altendorf
  canton: SZ
  country: CH
  basis: verified
  source: uid-register
  note: >-
    The registered seat moved from Vilters-Wangs SG to Altendorf SZ in 2026
    (articles amended 25 June 2026).

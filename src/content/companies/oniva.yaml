i18n:
  de:
    description: 'Softwareunternehmen für Events in Dübendorf ZH, 2024 von Swisscom Broadcast ausgegründet, das die Eventmanagement-Plattform Oniva (früher Zoon) entwickelt und betreibt.'
    notes:
      swissFounded.note: 'Im Januar 2024 mit Sitz in Zürich im Handelsregister des Kantons Zürich eingetragen; 2026 wurde der Sitz nach Dübendorf verlegt. Die Software wurde ab 2019 von der Swisscom Broadcast AG unter dem Namen Zoon entwickelt.'
      ownership.note: 'Oniva wurde am 1. März 2024 von Mitgliedern des Zoon-Teams aus der Swisscom Broadcast ausgegründet. Gegenüber Netzwoche sagte der CEO, dass Swisscom nicht beteiligt ist. Die Aktionäre der Aktiengesellschaft werden nicht veröffentlicht; die vier Verwaltungsratsmitglieder, zugleich Mitgründer, sind laut Handelsregister Schweizer Bürger. Bis November 2026 wurde keine Übernahme gemeldet.'

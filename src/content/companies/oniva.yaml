name: Oniva AG
shortName: Oniva
type: company
description: >-
  Event software company in Dübendorf ZH, spun off from Swisscom Broadcast in
  2024, that develops and operates the event management platform Oniva
  (formerly Zoon).
website: https://www.oniva.events
founded: 2024
swissFounded:
  value: yes
  basis: verified
  source: zefix
  note: >-
    Entered in the commercial register of the canton of Zurich in January 2024
    with its seat in Zurich; the seat moved to Dübendorf in 2026. The software
    was developed from 2019 by Swisscom Broadcast AG under the name Zoon.
headquarters:
  city: Dübendorf
  canton: ZH
  country: CH

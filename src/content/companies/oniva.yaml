ownership:
  swissOwned: unknown
  basis: vendor
  source: press
  note: >-
    Oniva was spun off from Swisscom Broadcast on 1 March 2024 by members of the
    Zoon team. Its CEO told Netzwoche that Swisscom holds no stake. The
    shareholders of the stock corporation are not published; the four board
    members, who are also the co-founders, are Swiss citizens according to the
    commercial register. No acquisition was found in reporting up to November
    2026.

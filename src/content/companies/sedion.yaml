name: Sedion AG
shortName: Sedion
type: company
description: >-
  Central Swiss cybersecurity company with offices in Cham that offers an
  additional off-site backup of critical company data stored in a former
  military bunker.
website: https://www.sedion.ch
swissFounded:
  value: yes
  basis: verified
  source: zefix
  note: >-
    The current legal entity was registered in Lucerne as codeBase GmbH, later
    Codebase AG. In 2024 it absorbed the original Sedion AG of Ennetbürgen
    (CHE-485.497.177) by merger, took over its name and moved its seat to
    Ennetbürgen.

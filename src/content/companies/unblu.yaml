name: unblu inc.
shortName: Unblu
type: company
description: >-
  Basel-based software company, part of the Swiss Post group, that develops
  secure messaging, video and co-browsing software for banks and wealth
  managers.
website: https://www.unblu.com
founded: 2008
swissFounded:
  value: yes
  basis: vendor
  source: about
  note: >-
    Unblu states that it was founded in Basel in 2008. Despite the "inc." in
    its name, the company is a Swiss Aktiengesellschaft; according to the
    commercial register its seat was in Sarnen (OW) until it moved to Basel in
    December 2017.
headquarters:
  city: Basel

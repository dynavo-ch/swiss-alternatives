ownership:
  swissOwned: yes
  parent: Die Schweizerische Post AG (Swiss Post)
  parentCountry: CH
  basis: verified
  source: swisspost-deal
  note: >-
    Swiss Post acquired a majority stake in Unblu in November 2022; Unblu
    continues to operate as a subsidiary under its own brand and describes
    itself as part of the Swiss Post group. Swiss Post is owned by the Swiss
    Confederation. In 2023 and 2025 unblu inc. absorbed its subsidiaries Unblu
    Cloud GmbH and Unblu adiacom AG, and in May 2025 its articles were amended
    to allow intra-group financing. The German subsidiary Unblu GmbH is based
    in Frankfurt am Main.

i18n:
  de:
    description: 'Softwareunternehmen aus Aarau, das seit über 35 Jahren ERP-Software für Schweizer KMU entwickelt und seit Januar 2026 zur deutschen SelectLine Group gehört.'
    notes:
      swissFounded.note: 'europa3000 gibt an, seit über 35 Jahren ERP-Software für Schweizer KMU anzubieten. Das Handelsregister führt das Unternehmen in Aarau, wohin es 2016 von Oberentfelden umgezogen ist.'
      ownership.note: 'europa3000 gibt an, seit dem 15. Januar 2026 zusammen mit der SelectLine Software AG und der groupe.iD SA Teil der SelectLine Group zu sein und dass die operative Führung in der Schweiz bleibt. Das Impressum der Gruppe nennt die SelectLine Holding GmbH in Magdeburg, Deutschland. Im Februar 2026 traten laut Handelsregister zwei deutsche Staatsangehörige in den Verwaltungsrat ein, darunter der Geschäftsführer der SelectLine Holding.'

ownership:
  swissOwned: unknown
  basis: inferred
  source: zefix
  note: >-
    The shareholder structure is not published. Co-founder Thomas Taroni, a
    Swiss citizen, is president of the board and executive chairman; the board
    also includes a German national living in Germany. QAI Ventures, linked to
    the uptownBasel campus, announced an investment in 2024. No acquisition by
    another group was found in reporting up to October 2026.

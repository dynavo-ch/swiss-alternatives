name: Phoenix Technologies AG
shortName: PHOENIQS
type: company
description: >-
  Swiss sovereign cloud and AI provider based in Freienbach SZ, operating under
  the PHOENIQS brand since 2026, with its data centre in Basel.
website: https://www.phoeniqs.com
founded: 2018
swissFounded:
  value: yes
  basis: verified
  source: zefix
  note: >-
    Entered in the commercial register of the canton of Zug in November 2018 as
    a holding company. It absorbed the subsidiaries Kore Technologies AG and
    Arpia AG in 2024 and Phoenix Systems AG, the original operator of the kvant
    cloud, in 2026, and moved its seat to Freienbach in 2026.
headquarters:
  city: Freienbach
  canton: SZ
  country: CH
  basis: verified
  source: zefix
  note: Further offices are at uptownBasel in Arlesheim and in Zurich.
jurisdiction: CH
registry:
  uid: CHE-478.932.618

i18n:
  de:
    description: 'Schweizer Anbieter für souveräne Cloud- und KI-Dienste mit Sitz in Freienbach SZ, seit 2026 unter der Marke PHOENIQS tätig, mit eigenem Rechenzentrum in Basel.'
    notes:
      swissFounded.note: 'Im November 2018 als Holdinggesellschaft im Handelsregister des Kantons Zug eingetragen. Das Unternehmen übernahm 2024 die Tochtergesellschaften Kore Technologies AG und Arpia AG sowie 2026 die Phoenix Systems AG, die ursprüngliche Betreiberin der kvant-Cloud, und verlegte 2026 seinen Sitz nach Freienbach.'
      headquarters.note: 'Weitere Büros befinden sich in uptownBasel in Arlesheim und in Zürich.'
      ownership.note: 'Die Aktionärsstruktur wird nicht veröffentlicht. Mitgründer Thomas Taroni, Schweizer Bürger, ist Verwaltungsratspräsident und Executive Chairman; dem Verwaltungsrat gehört zudem ein deutscher Staatsangehöriger mit Wohnsitz in Deutschland an. QAI Ventures, verbunden mit dem Campus uptownBasel, gab 2024 eine Investition bekannt. Bis Oktober 2026 wurde keine Übernahme durch eine andere Gruppe gemeldet.'

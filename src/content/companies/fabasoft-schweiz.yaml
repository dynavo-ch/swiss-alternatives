name: Fabasoft Schweiz AG
shortName: Fabasoft Schweiz
type: company
description: >-
  Bern-based software company, formed in 2022 from 4teamwork AG and the former
  Fabasoft Schweiz AG, majority-owned by the Austrian Fabasoft group.
website: https://www.fabasoft.ch
swissFounded:
  value: yes
  basis: verified
  source: zefix
  note: >-
    The legal entity began as Habacom GmbH in Muri bei Bern, renamed H7 Holding
    in 2019, whose partner was 4teamwork CEO Pascal Habegger. In 2022 it became
    an AG, absorbed 4teamwork AG and the previous Fabasoft Schweiz AG and was
    renamed Fabasoft 4teamwork AG; it has been called Fabasoft Schweiz AG since
    2025.

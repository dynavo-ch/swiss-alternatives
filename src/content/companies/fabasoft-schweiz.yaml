  parent: Fabasoft AG
  parentCountry: AT
  basis: vendor
  source: acquisition
  note: >-
    In 2022 Fabasoft AG of Linz, Austria, announced that after the acquisition
    and merger it would hold 70% of Fabasoft 4teamwork AG, with former
    4teamwork CEO Pascal Habegger retaining 30%. No later change to these
    shares was found. A managing director entered in the commercial register
    in 2026 lives in Linz.

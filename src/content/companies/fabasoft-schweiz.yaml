i18n:
  de:
    description: 'Berner Softwareunternehmen, 2022 aus der 4teamwork AG und der früheren Fabasoft Schweiz AG hervorgegangen, mehrheitlich im Besitz der österreichischen Fabasoft-Gruppe.'
    notes:
      swissFounded.note: 'Die Rechtseinheit entstand als Habacom GmbH in Muri bei Bern, 2019 in H7 Holding umbenannt, deren Gesellschafter 4teamwork-CEO Pascal Habegger war. 2022 wurde sie zur AG, übernahm die 4teamwork AG und die bisherige Fabasoft Schweiz AG und wurde in Fabasoft 4teamwork AG umbenannt; seit 2025 heisst sie Fabasoft Schweiz AG.'
      ownership.note: 'Die Fabasoft AG aus Linz (Österreich) kündigte 2022 an, nach Übernahme und Fusion 70 % der Fabasoft 4teamwork AG zu halten, während der frühere 4teamwork-CEO Pascal Habegger 30 % behalte. Eine spätere Änderung dieser Anteile wurde nicht gefunden. Ein 2026 im Handelsregister eingetragener Geschäftsführer wohnt in Linz.'

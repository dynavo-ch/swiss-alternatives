ownership:
  swissOwned: yes
  parent: Proton Foundation (Fondation Proton)
  parentCountry: CH
  basis: vendor
  source: ownership
  note: >-
    Proton states that the non-profit Proton Foundation is the primary
    shareholder of Proton AG; since June 2024 it has been the largest voting
    shareholder, endowed with shares donated by co-founders Andy Yen and Jason
    Stockman and first employee Dingchao Lu. The foundation is registered in
    Plan-les-Ouates (Fondation Proton, CHE-418.863.304). Employees hold most of
    the remaining shares; smaller stakes are held by the Geneva non-profit
    FONGIT and by Proton users. Proton says it has no venture capital investors.
    Exact percentages are not published.

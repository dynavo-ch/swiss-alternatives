name: Proton AG
shortName: Proton
type: company
description: >-
  Company based in Plan-les-Ouates near Geneva that develops encrypted email,
  calendar, cloud storage, password manager, VPN and AI assistant services.
  Its primary shareholder is the non-profit Proton Foundation.
website: https://proton.me
founded: 2014
swissFounded:
  value: yes
  basis: vendor
  source: about
  note: >-
    Proton states it was founded in Switzerland in 2014 by scientists who met at
    CERN. The company, formerly Proton Technologies AG, is entered in the Geneva
    commercial register (renamed Proton AG in 2021).
headquarters:
  city: Plan-les-Ouates
  canton: GE
  country: CH

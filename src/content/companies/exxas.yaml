name: Exxas AG
shortName: Exxas
type: company
description: >-
  Software company in Schlieren ZH that develops and operates Exxas, a cloud
  business platform for SMEs covering ERP, CRM, accounting and HR.
website: https://www.exxas.net
founded: 2020
swissFounded:
  value: yes
  basis: verified
  source: zefix
  note: >-
    Entered in the commercial register of the canton of Zurich in April 2020 as
    Exxas GmbH (articles dated 9 March 2020) and converted into Exxas AG in
    May 2022. According to the company, the founders started the IT services
    firm Exxo in 2009 and released the first version of Exxas in 2011, before
    the product moved into its own company.
headquarters:
  city: Schlieren

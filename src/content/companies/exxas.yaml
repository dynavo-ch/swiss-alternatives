  url: https://www.zefix.ch/en/search/entity/list/firm/1432944
ownership:
  swissOwned: yes
  basis: inferred
  source: zefix
  note: >-
    At founding in 2020 the partners were the co-founders Stefan Dettwiler
    (150 of 200 capital contributions) and Pascal Jenni (50), both Swiss
    citizens. When the GmbH was converted into an AG in 2022, the shares went to
    the existing partners. Stefan Dettwiler chairs the board and Pascal Jenni is
    a board member. The current shareholders are not published, and no parent
    company or outside investor is named. The founders' former IT services
    company, exxo it-services AG, was acquired by the Sequotech group in 2023;
    Exxas presents it as a separate business, and the register shows no related
    change at Exxas AG.

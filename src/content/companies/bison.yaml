name: Bison Schweiz AG
shortName: BISON
type: company
description: >-
  Sursee IT company that develops ERP software for retail, wholesale,
  agricultural and energy trading and is the IT provider of the fenaco-LANDI group.
website: https://www.bison-group.com
swissFounded:
  value: yes
  basis: inferred
  source: zefix
  note: >-
    Registered in Oberkirch in the canton of Lucerne, earlier under the name
    Alpha Intersoftware AG; between 2002 and 2016 it absorbed an earlier Bison
    Schweiz AG of Sursee and Bison Holding AG. BISON states more than 40 years of
    market experience; the founding date is not stated in the sources used.
headquarters:
  city: Oberkirch
  canton: LU
  country: CH
  basis: verified
  source: zefix
  note: >-
    The registered seat is Oberkirch; the office address is in Sursee. Further
    offices are in Bern, Winterthur and Puidoux, and the subsidiary Bison
    Deutschland GmbH is based in Kaiserslautern.
jurisdiction: CH
registry:
  uid: CHE-105.910.097
  url: https://www.zefix.ch/en/search/entity/list/firm/330180
ownership:
  swissOwned: yes
  parent: fenaco Genossenschaft
  parentCountry: CH
  basis: vendor
  source: fenaco-report
  note: >-
    The 2025 annual report of fenaco, the Swiss agricultural cooperative behind
    the LANDI stores, lists Bison Schweiz AG and Bison Deutschland GmbH as 100%
    subsidiaries. fenaco took over all shares in 2014, and on 1 January 2025 its
    internal IT unit fenaco Informatik was merged into BISON. No change of
    ownership was found in reporting up to November 2026.
labels:

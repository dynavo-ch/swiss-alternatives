i18n:
  de:
    description: 'IT-Unternehmen aus Sursee, das ERP-Software für Detailhandel, Grosshandel, Agrar- und Energiehandel entwickelt und IT-Dienstleister der fenaco-LANDI Gruppe ist.'
    notes:
      swissFounded.note: 'Eingetragen in Oberkirch im Kanton Luzern, früher unter dem Namen Alpha Intersoftware AG; zwischen 2002 und 2016 übernahm es eine frühere Bison Schweiz AG aus Sursee und die Bison Holding AG. BISON gibt über 40 Jahre Markterfahrung an; das Gründungsdatum wird in den verwendeten Quellen nicht genannt.'
      headquarters.note: 'Der eingetragene Sitz ist Oberkirch; die Geschäftsadresse liegt in Sursee. Weitere Standorte sind Bern, Winterthur und Puidoux, und die Tochtergesellschaft Bison Deutschland GmbH hat ihren Sitz in Kaiserslautern.'
      ownership.note: 'Der Geschäftsbericht 2025 der fenaco, der Schweizer Agrargenossenschaft hinter den LANDI-Läden, führt die Bison Schweiz AG und die Bison Deutschland GmbH als 100-prozentige Tochtergesellschaften. fenaco übernahm 2014 sämtliche Aktien, und am 1. Januar 2025 wurde die interne IT-Einheit fenaco Informatik in BISON integriert. Bis November 2026 wurde keine Änderung der Eigentumsverhältnisse gemeldet.'

  note: >-
    When libracore GmbH was converted into an AG in July 2019, all 100,000
    registered shares went to the existing partners, Lars Müller (195 of 200
    capital contributions) and Joël Mesmer (5), both Swiss citizens. Lars Müller
    is chairman of the board and CEO; the board also includes Stefan Fink, an
    Austrian citizen who runs the libracore customer Fink Zeitsysteme GmbH, and

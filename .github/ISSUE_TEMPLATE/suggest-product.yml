name: Suggest a product
description: Propose a Swiss product or service for the directory.
title: 'Suggestion: '
labels: [suggestion]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Please read the [listing criteria](https://swiss-alternatives.ch/methodology/) first.
        Sources are essential — we only publish facts we can verify.
        Maintainers may add the `research` label to have Claude draft the entry as a pull request for review.
  - type: input
    id: name
    attributes:
      label: Product name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Product website
      placeholder: https://
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Source code repository (if open source)
      placeholder: https://github.com/…
  - type: input
    id: company
    attributes:
      label: Company (legal name)
      description: As listed in the Swiss commercial register, e.g. "Example AG".
    validations:
      required: true
  - type: input
    id: headquarters
    attributes:
      label: Headquarters (city, canton)
      placeholder: Zürich, ZH
  - type: input
    id: category
    attributes:
      label: Category
      placeholder: e.g. password managers, email, cloud platforms
  - type: textarea
    id: why
    attributes:
      label: Why it qualifies
      description: Swiss headquarters? Swiss ownership? Developed in Switzerland? Which foreign products does it replace?
    validations:
      required: true
  - type: textarea
    id: hosting
    attributes:
      label: Where is customer data hosted?
      description: Data-centre locations and infrastructure provider, if known.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: One URL per line — imprint, privacy policy, data-centre or ownership information, commercial register.
    validations:
      required: true
  - type: dropdown
    id: relation
    attributes:
      label: Your relation to the product
      options:
        - No relation (user / interested party)
        - I work for the vendor
        - Other
    validations:
      required: true
